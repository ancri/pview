<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- A plot on paper: pale panel, dark points, a red fit line through them. The dark
       edge keeps it from dissolving into a light tab strip, and the halos around the
       points keep them separate from the line down to 16px. -->
  <rect x="1.6" y="1.6" width="60.8" height="60.8" rx="13" fill="#fcf8f1" stroke="#263043" stroke-width="3.2"/>
  <path d="M14 46L50 20" fill="none" stroke="#e8552f" stroke-width="5.5" stroke-linecap="round"/>
  <g fill="#263043" stroke="#fcf8f1" stroke-width="2">
    <circle cx="19" cy="37" r="5"/>
    <circle cx="29" cy="42" r="5"/>
    <circle cx="38" cy="27" r="5"/>
    <circle cx="47" cy="32" r="5"/>
  </g>
</svg>
