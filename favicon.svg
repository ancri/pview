    <rect x="13" y="36" width="10" height="15" rx="2.5"/>
    <rect x="27" y="26" width="10" height="25" rx="2.5"/>
    <rect x="41" y="14" width="10" height="37" rx="2.5"/>
  </g>
</svg>
